<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS Event Assignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Event Handling -->
  <button id="colorBtn">Click here!</button>
  <div id="hoverBox">Hover over me!</div>
  <input type="text" id="keypressInput" placeholder="Type something..." />

  <!-- Interactive Elements -->
  <button id="colorToggleBtn">Proceed</button>
  <!-- Image Gallery -->
    <div class="aspect-ratio-box">
        <img id="galleryImage" src="https://images.unsplash.com/photo-1487088678257-3a541e6e3922?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Gallery" />
    </div>
  <button id="nextImageBtn">Next</button>

  <div class="tabs">
    <button class="tab-btn" data-tab="tab1">Bio</button>
    <button class="tab-btn" data-tab="tab2">Word of the Day</button>
  </div> 
  <div id="tab1" class="tab-content">Being elevated day by day</div>
  <div id="tab2" class="tab-content hidden">Spiritually everything is a living thing</div>

  <!-- Form Validation -->
  <form id="signupForm">
    <input type="text" id="username" placeholder="Username" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Sign Up</button>
    <div id="formFeedback"></div>
  </form>

  <script src="script.js"></script>
</body>
</html>
